name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma exige una URL para generar el cliente; no se conecta a nada.
  DATABASE_URL: "postgresql://nexa:nexa@localhost:5432/nexa?schema=public"
  DIRECT_URL: "postgresql://nexa:nexa@localhost:5432/nexa?schema=public"

jobs:
  verify:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sin `version`: la manda `packageManager` de package.json. Declarar
      # las dos hace que la accion falle con ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      # Aquí es donde se verifica la constitución, principio 2: si
      # packages/core importa Next, Prisma o React, este paso falla.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  hardening:
    name: E2E · Accesibilidad · Lighthouse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa
          POSTGRES_DB: nexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexa:nexa@localhost:5432/nexa?schema=public
      DIRECT_URL: postgresql://nexa:nexa@localhost:5432/nexa?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXA_SHIPPING_FLAT_CENTS: "1200000"
      ADMIN_SESSION_SECRET: ci-admin-session-secret-32-chars-min
      CRON_SECRET: ci-cron-secret
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    steps:
      - uses: actions/checkout@v7

      # Sin `version`: la manda `packageManager` de package.json. Declarar
      # las dos hace que la accion falle con ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      - name: Entorno para Prisma
        run: |
          printf 'DATABASE_URL=%s\nDIRECT_URL=%s\n' "$DATABASE_URL" "$DIRECT_URL" > .env

      - name: Migrar y sembrar
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed

      # Hasta ahora solo corrían a mano, y contra la base de Neon que sirve la
      # tienda. Aquí van contra el PostgreSQL efímero del job: mueven stock y
      # lo dejan como estaba, así que el E2E de después parte de lo sembrado.
      - name: Tests de integración
        run: pnpm test:integration

      # `vercel-build` y no `build`: es el que copia el motor de Prisma a
      # apps/web/generated/client, que es donde lo busca el cliente una vez
      # webpack lo ha empaquetado dentro de la app. Con `build` a secas el
      # servidor arranca pero Prisma no puede inicializarse, y como el
      # catalogo tiene repositorio de respaldo estatico la tienda parece
      # funcionar hasta que alguien añade algo al carrito.
      - name: Build como en produccion
        run: |
          # Este paso ya fallo una vez sin dejar rastro legible: la anotacion
          # decia solo "exit code 1". `next build` descarga las fuentes de
          # Google en cada build porque el runner no trae .next/cache, asi
          # que un tropiezo de red basta para tumbarlo.
          if ! salida=$(pnpm --filter @nexa/web vercel-build 2>&1); then
            echo "$salida"
            echo "::error::el build fallo: $(echo "$salida" | tail -25 | tr -s '[:space:]' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "$salida" | tail -30

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E y Lighthouse
        run: |
          pnpm start > /tmp/nexa-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null; then break; fi
            if [ "$i" -eq 60 ]; then
              echo "La app no respondió en :3000"
              tail -50 /tmp/nexa-web.log
              exit 1
            fi
            sleep 2
          done
          # Si el E2E falla, el porque casi siempre esta en el log del
          # servidor, no en el del test: un 500 llega al navegador como un
          # mensaje generico. Se vuelca y ademas se resume en una anotacion,
          # que es lo unico legible sin iniciar sesion en GitHub.
          if ! pnpm test:e2e; then
            echo "::group::Log del servidor"
            tail -100 /tmp/nexa-web.log
            echo "::endgroup::"
            echo "::error::E2E fallo. Servidor: $(tail -20 /tmp/nexa-web.log | tr -s '[:space:]' ' ' | cut -c1-900)"
            exit 1
          fi
          CHROME=$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")
          pnpm exec lhci autorun --collect.settings.chromePath="$CHROME"

  docker:
    name: Imagen Docker · manifiestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ADR-0006: no se opera el cluster, pero la imagen y los manifiestos
      # se validan en cada PR para que la portabilidad no envejezca sin uso.
      - name: Construir imagen web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          target: runner
          push: false
          load: true
          tags: nexa-web:ci

      # Construirla solo demuestra que compila. Esto comprueba que arranca:
      # que el servidor de `output: standalone` levanta, que los estaticos y
      # public viajaron dentro, y que sin DATABASE_URL la tienda sirve la
      # vitrina desde el JSON en vez de caerse (RNF-03).
      - name: Arrancar la imagen y comprobar que sirve
        run: |
          docker run -d --name nexa-web-ci -p 3000:3000 nexa-web:ci
          arriba=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/catalogo -o /tmp/catalogo.html; then arriba="si"; break; fi
            sleep 2
          done

          if [ -z "$arriba" ]; then
            echo "::group::Log del contenedor"
            docker logs nexa-web-ci 2>&1 || true
            echo "::endgroup::"
            echo "::error::la imagen no respondio en :3000: $(docker logs nexa-web-ci 2>&1 | tail -15 | tr -s '[:space:]' ' ' | cut -c1-700)"
            docker rm -f nexa-web-ci >/dev/null 2>&1 || true
            exit 1
          fi

          fallos=""
          grep -q "Catálogo" /tmp/catalogo.html || fallos="$fallos catalogo-sin-contenido"
          curl -sf http://localhost:3000/api/alive -o /dev/null || fallos="$fallos api-alive"
          # Un estatico cualquiera: si `public` no viajo, esto da 404.
          curl -sf -o /dev/null http://localhost:3000/img/productos/1-nitro-tech-2-lbs.webp || fallos="$fallos falta-public"

          docker rm -f nexa-web-ci >/dev/null 2>&1 || true

          if [ -n "$fallos" ]; then
            echo "::error::la imagen arranca pero algo no sirve:$fallos"
            exit 1
          fi
          echo "La imagen arranca y sirve catalogo, /api/alive y estaticos"

      - name: Construir imagen de migraciones
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          target: migrate
          push: false

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.31.6

      - name: Validar manifiestos
        run: |
          # `kubectl apply --dry-run=client` sigue pidiendole el esquema
          # OpenAPI a un cluster, y aqui no hay ninguno: fallaba con
          # "connection refused" a localhost:8080. Se compone con kustomize
          # y se valida la sintaxis sin contactar con nadie.
          # Separado en dos para saber cual de los dos fallo: componer los
          # manifiestos o decodificarlos.
          if ! compuesto=$(kubectl kustomize infra/k8s 2>&1); then
            echo "$compuesto"
            echo "::error::kustomize no pudo componer infra/k8s: $(echo "$compuesto" | tail -5 | tr -s '[:space:]' ' ' | cut -c1-700)"
            exit 1
          fi

          # `kubectl apply --dry-run=client` no sirve aqui ni con
          # --validate=false: sigue necesitando la discovery del cluster para
          # resolver los tipos. Se comprueba lo que si se puede sin cluster:
          # que kustomize compone y que estan todos los objetos que promete
          # el runbook. La validacion contra el esquema de Kubernetes pediria
          # kubeconform, que es una dependencia mas y una decision aparte.
          faltan=""
          for tipo in Namespace ConfigMap Secret StatefulSet Deployment Service Ingress Job CronJob HorizontalPodAutoscaler; do
            printf '%s' "$compuesto" | grep -q "^kind: $tipo$" || faltan="$faltan $tipo"
          done
          if [ -n "$faltan" ]; then
            printf '%s' "$compuesto"
            echo "::error::faltan objetos en los manifiestos compuestos:$faltan"
            exit 1
          fi
          echo "Objetos compuestos: $(printf '%s' "$compuesto" | grep -c '^kind:')"
