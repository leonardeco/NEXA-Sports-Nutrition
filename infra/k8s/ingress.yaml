apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexa-web
  namespace: nexa
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: nexa.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexa-web
                port:
                  name: http
