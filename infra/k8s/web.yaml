apiVersion: v1
kind: Service
metadata:
  name: nexa-web
  namespace: nexa
spec:
  selector:
    app.kubernetes.io/name: nexa-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexa-web
  namespace: nexa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexa-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexa-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-migrate
          image: pgvector/pgvector:pg17
          command:
            - /bin/sh
            - -c
            - until pg_isready -h nexa-postgres -U nexa -d nexa; do sleep 2; done
      containers:
        - name: web
          image: nexa-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: nexa-config
            - secretRef:
                name: nexa-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/alive
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexa-web
  namespace: nexa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexa-web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
