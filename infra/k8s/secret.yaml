# Valores de laboratorio, iguales a docker-compose. No son credenciales de
# producción: cámbialos antes de exponer el cluster (ver docs/runbook-kubernetes.md).
apiVersion: v1
kind: Secret
metadata:
  name: nexa-secret
  namespace: nexa
type: Opaque
stringData:
  POSTGRES_USER: nexa
  POSTGRES_PASSWORD: nexa
  POSTGRES_DB: nexa
  DATABASE_URL: postgresql://nexa:nexa@nexa-postgres:5432/nexa?schema=public
  DIRECT_URL: postgresql://nexa:nexa@nexa-postgres:5432/nexa?schema=public
  ADMIN_SESSION_SECRET: change-me-admin-session-secret-32ch
  CRON_SECRET: change-me-cron-secret-32-characters-ok
  NEXT_PUBLIC_WOMPI_PUBLIC_KEY: ""
  WOMPI_PRIVATE_KEY: ""
  WOMPI_INTEGRITY_SECRET: ""
  WOMPI_EVENTS_SECRET: ""
  ANTHROPIC_API_KEY: ""
