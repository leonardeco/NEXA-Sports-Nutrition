apiVersion: batch/v1
kind: CronJob
metadata:
  name: nexa-expire-orders
  namespace: nexa
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: expire
              image: curlimages/curl:8.11.1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: nexa-secret
                      key: CRON_SECRET
              command:
                - /bin/sh
                - -c
                - curl -fsS -H "Authorization: Bearer $CRON_SECRET" http://nexa-web:3000/api/cron/expire-orders
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
